
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.20
    steps:
      - checkout
      - run: npm install
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}

  deploy:
    docker:
      - image: cimg/node:20.20
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:iUvqvlbqrQIuziIJ/cmCq3byu1m3kgtoxC6Zqu3ZKbk"

      - run:
          name: Check loaded SSH key
          command: ssh-add -l -E sha256

      - run:
          name: Deploy application to EC2
          command: |
            ssh -o StrictHostKeyChecking=no "$EC2_USERNAME@$EC2_PUBLIC_DNS" 'cd /home/ubuntu/ExampleApplication && git pull origin main && bash deploy.sh'

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
